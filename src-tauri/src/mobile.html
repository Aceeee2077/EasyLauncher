<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EasyLauncher">
<title>EasyLauncher 手机控制台</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root {
  color-scheme: dark;
  --bg: #060f0a;
  --panel: rgba(22, 38, 29, 0.72);
  --line: rgba(158, 255, 195, 0.14);
  --text: #eaf6ee;
  --muted: #9db4a6;
  --green: #59e08d;
  --amber: #f0bf5f;
  --red: #ff7a7a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(44, 120, 78, 0.45), transparent 62%),
    radial-gradient(900px 600px at -10% 30%, rgba(20, 70, 48, 0.5), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  min-height: 100vh;
}
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: 0.2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
.conn { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.03); }
.conn.bad { color: var(--red); border-color: rgba(255,122,122,0.35); }
main { display: grid; gap: 14px; }
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.05);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 620; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; }
.badge { flex: none; font-size: 11px; padding: 5px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.badge.stopped, .badge.installationFailed { color: var(--muted); border-color: var(--line); }
.badge.installing, .badge.starting, .badge.stopping, .badge.restarting { color: var(--amber); background: rgba(240,191,95,0.1); border-color: rgba(240,191,95,0.3); }
.badge.running { color: var(--green); background: rgba(89,224,141,0.1); border-color: rgba(89,224,141,0.32); }
.badge.crashed { color: var(--red); background: rgba(255,122,122,0.1); border-color: rgba(255,122,122,0.32); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
button {
  font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
  border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06);
  padding: 9px 13px; min-height: 38px;
  transition: transform 0.12s ease, background 0.15s ease;
}
button:active { transform: scale(0.97); }
button.primary { background: rgba(89, 224, 141, 0.16); border-color: rgba(89,224,141,0.4); color: #c9ffdd; }
button.danger { background: rgba(255, 122, 122, 0.12); border-color: rgba(255,122,122,0.35); color: #ffd2d2; }
button:disabled { opacity: 0.4; cursor: default; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 620; }
pre {
  margin: 0 0 12px; padding: 12px; border-radius: 14px;
  background: rgba(0, 0, 0, 0.42); border: 1px solid rgba(255,255,255,0.05);
  font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  font-size: 11.5px; line-height: 1.55; color: #cfe6d8;
  height: 42vh; min-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
form { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text);
  background: rgba(0,0,0,0.34); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  outline: none;
}
input:focus { border-color: rgba(89,224,141,0.5); }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 8px; }
.hidden { display: none; }
footer { margin-top: 18px; text-align: center; color: rgba(157,180,166,0.7); font-size: 11px; line-height: 1.6; }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
  max-width: 86vw; padding: 10px 15px; border-radius: 999px;
  background: rgba(15, 28, 21, 0.94); border: 1px solid var(--line);
  color: #dff7e8; font-size: 12.5px; transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 20;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { border-color: rgba(255,122,122,0.4); color: #ffd7d7; }
.alert-bar {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 14px; padding: 11px 14px; border-radius: 16px;
  background: rgba(255, 122, 122, 0.12); border: 1px solid rgba(255, 122, 122, 0.38);
  color: #ffd7d7; font-size: 13px;
}
.alert-bar span { flex: 1; overflow-wrap: anywhere; }
.alert-bar button { flex: none; min-height: 30px; padding: 4px 10px; border-radius: 9px; }
#companion .actions { margin-top: 10px; }
#companion .meta { line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>EasyLauncher</div>
  <div class="conn" id="conn">连接中…</div>
</header>
<main>
  <div class="alert-bar hidden" id="alertBar" role="alert">
    <span id="alertText"></span>
    <button type="button" id="alertClose" aria-label="关闭提醒">关闭</button>
  </div>
  <section id="servers"></section>
  <section class="panel hidden" id="consolePanel">
    <div class="panel-head">
      <h2 id="consoleTitle">控制台</h2>
      <button type="button" id="closeConsole">收起</button>
    </div>
    <pre id="console"></pre>
    <form id="commandForm">
      <input id="commandInput" placeholder="输入命令，例如 say 大家好" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">发送</button>
    </form>
  </section>
  <section class="panel" id="companion">
    <div class="panel-head">
      <h2>状态提醒</h2>
      <span class="meta" id="notifyState">未开启</span>
    </div>
    <p class="meta" id="notifyHint">
      服务器崩溃、安装失败或意外停止时提醒你。提醒只在本机页面产生，不会经过第三方推送服务。
    </p>
    <div class="actions">
      <button type="button" id="notifyToggle">开启提醒</button>
      <button type="button" id="installButton" class="hidden">添加到主屏幕</button>
    </div>
  </section>
</main>
<footer>
  仅在同一局域网内可用 · 关闭手机控制台或退出 EasyLauncher 后链接立即失效<br>
  状态提醒需要保持此页面打开；浏览器可能限制后台轮询频率。
</footer>
<div id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  var token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  var csrf = "";
  var selected = null;
  var servers = [];
  var busy = false;
  var toastTimer = null;
  var labels = {
    stopped: "已停止", installing: "安装中", installationFailed: "安装失败",
    starting: "启动中", running: "运行中", stopping: "停止中",
    restarting: "重启中", crashed: "已崩溃"
  };
  var activeStates = ["starting", "running", "stopping", "restarting"];
  var serversEl = document.getElementById("servers");
  var panel = document.getElementById("consolePanel");
  var consoleEl = document.getElementById("console");
  var titleEl = document.getElementById("consoleTitle");
  var connEl = document.getElementById("conn");
  var toastEl = document.getElementById("toast");
  var notifyToggle = document.getElementById("notifyToggle");
  var notifyStateEl = document.getElementById("notifyState");
  var notifyHintEl = document.getElementById("notifyHint");
  var installButton = document.getElementById("installButton");
  var alertBar = document.getElementById("alertBar");
  var alertText = document.getElementById("alertText");
  var known = null;
  var installPrompt = null;
  var refreshTimer = null;
  var consoleTimer = null;
  var secure = typeof window.isSecureContext === "boolean" ? window.isSecureContext : false;
  var notifyPref = false;
  try { notifyPref = localStorage.getItem("el_notify") === "1"; } catch (error) { notifyPref = false; }

  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.className = "show" + (bad ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ""; }, 2600);
  }

  function report(error) {
    if (error && error.status === 401) {
      stopTimers();
      setConn(false, "会话已失效");
      toast("会话已失效，请重新扫码或粘贴访问令牌。", true);
      showLogin("会话已失效，请在 EasyLauncher 中重新扫码，或在下方粘贴访问令牌。");
      return;
    }
    toast(error && error.message ? error.message : "请求失败", true);
  }

  function api(path, body) {
    var options = { credentials: "same-origin", headers: {} };
    if (body) {
      options.method = "POST";
      options.headers["Content-Type"] = "application/json";
      options.headers["X-CSRF-Token"] = csrf;
      options.body = JSON.stringify(body);
    }
    return fetch(path, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) {
          var error = new Error(data.error || ("请求失败 " + response.status));
          error.status = response.status;
          throw error;
        }
        return data;
      });
    });
  }

  function login() {
    return fetch("/api/session", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) {
          var error = new Error(data.error || "链接无效，请在 EasyLauncher 中重新扫码。");
          error.status = response.status;
          throw error;
        }
        csrf = data.csrf || "";
        token = "";
      });
    });
  }

  function startTimers() {
    if (refreshTimer) return;
    refreshTimer = setInterval(refresh, 3000);
    consoleTimer = setInterval(loadConsole, 2500);
  }

  function stopTimers() {
    clearInterval(refreshTimer);
    clearInterval(consoleTimer);
    refreshTimer = null;
    consoleTimer = null;
  }

  function connect() {
    return api("/api/session").then(function (data) {
      csrf = data.csrf || "";
    }).catch(function (error) {
      if (error.status !== 401) throw error;
      if (!token) throw error;
      return login();
    }).then(function () {
      startTimers();
      return refresh();
    });
  }

  function showLogin(message) {
    setConn(false, "未连接");
    serversEl.textContent = "";
    var card = document.createElement("div");
    card.className = "card";
    var text = document.createElement("p");
    text.className = "empty";
    text.style.padding = "0 0 14px";
    text.textContent = message;
    card.appendChild(text);
    var form = document.createElement("form");
    var input = document.createElement("input");
    input.type = "password";
    input.placeholder = "粘贴从电脑复制的访问令牌";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;
    var submit = document.createElement("button");
    submit.type = "submit";
    submit.className = "primary";
    submit.textContent = "连接";
    form.appendChild(input);
    form.appendChild(submit);
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var value = input.value.trim();
      if (!value) return;
      token = value;
      input.disabled = true;
      submit.disabled = true;
      connect().then(function () {
        input.value = "";
      }).catch(function (error) {
        input.disabled = false;
        submit.disabled = false;
        toast(error && error.status === 401 ? "访问令牌无效，请重新复制。" : (error && error.message ? error.message : "连接失败"), true);
      });
    });
    card.appendChild(form);
    serversEl.appendChild(card);
  }

  function boot() {
    connect().catch(function (error) {
      var message = error && error.status === 401
        ? "链接已失效，请在 EasyLauncher 中重新扫码，或在下方粘贴访问令牌。"
        : (error && error.status && error.message ? error.message : "无法连接，请检查手机与电脑是否在同一 Wi-Fi。");
      showLogin(message);
    });
  }

  function setConn(ok, text) {
    connEl.textContent = text;
    connEl.className = "conn" + (ok ? "" : " bad");
  }

  function action(id, name, kind) {
    if (busy) return;
    busy = true;
    render();
    api("/api/action", { id: id, action: kind }).then(function () {
      toast(name + " · " + (kind === "start" ? "启动请求已发送" : kind === "stop" ? "停止请求已发送" : "重启请求已发送"));
      setTimeout(refresh, 900);
    }).catch(report).finally(function () {
      busy = false;
      render();
    });
  }

  function openConsole(server) {
    selected = server.id;
    titleEl.textContent = server.name + " · 控制台";
    panel.classList.remove("hidden");
    consoleEl.textContent = "";
    loadConsole();
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    render();
  }

  function render() {
    serversEl.textContent = "";
    if (!servers.length) {
      var empty = document.createElement("div");
      empty.className = "card empty";
      empty.textContent = "还没有服务器。先在电脑上创建一个吧。";
      serversEl.appendChild(empty);
      return;
    }
    servers.forEach(function (server) {
      var card = document.createElement("article");
      card.className = "card";
      var head = document.createElement("div");
      head.className = "card-head";
      var info = document.createElement("div");
      var name = document.createElement("h3");
      name.textContent = server.name;
      var meta = document.createElement("div");
      meta.className = "meta";
      var players = server.players > 0 ? " · " + server.players + " 名玩家在线" : "";
      meta.textContent = "端口 " + server.port + players;
      info.appendChild(name);
      info.appendChild(meta);
      var badge = document.createElement("span");
      badge.className = "badge " + server.status;
      badge.textContent = labels[server.status] || server.status;
      head.appendChild(info);
      head.appendChild(badge);
      card.appendChild(head);

      if (server.message && activeStates.indexOf(server.status) >= 0) {
        var note = document.createElement("p");
        note.className = "meta";
        note.style.margin = "8px 0 0";
        note.textContent = server.message;
        card.appendChild(note);
      }

      var actions = document.createElement("div");
      actions.className = "actions";
      var active = activeStates.indexOf(server.status) >= 0;
      if (!active) {
        var start = document.createElement("button");
        start.className = "primary";
        start.textContent = server.status === "crashed" ? "重新启动" : "启动";
        start.disabled = busy || server.status === "installing";
        start.onclick = function () { action(server.id, server.name, "start"); };
        actions.appendChild(start);
      } else {
        var stop = document.createElement("button");
        stop.className = "danger";
        stop.textContent = "停止";
        stop.disabled = busy;
        stop.onclick = function () { action(server.id, server.name, "stop"); };
        actions.appendChild(stop);
      }
      if (server.status === "running") {
        var restart = document.createElement("button");
        restart.textContent = "重启";
        restart.disabled = busy;
        restart.onclick = function () { action(server.id, server.name, "restart"); };
        actions.appendChild(restart);
      }
      var consoleButton = document.createElement("button");
      consoleButton.textContent = selected === server.id ? "正在查看控制台" : "查看控制台";
      consoleButton.disabled = selected === server.id;
      consoleButton.onclick = function () { openConsole(server); };
      actions.appendChild(consoleButton);
      card.appendChild(actions);
      serversEl.appendChild(card);
    });
  }

  function refresh() {
    return api("/api/state").then(function (data) {
      servers = data.servers || [];
      setConn(true, "已连接");
      track(servers);
      render();
      if (selected && !servers.some(function (server) { return server.id === selected; })) {
        selected = null;
        panel.classList.add("hidden");
      }
    }).catch(function (error) {
      setConn(false, "连接断开");
      report(error);
    });
  }

  function loadConsole() {
    if (!selected) return;
    api("/api/console?id=" + encodeURIComponent(selected)).then(function (data) {
      var lines = data.lines || [];
      var atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 60;
      consoleEl.textContent = lines.map(function (line) { return line.text; }).join("\n");
      if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
    }).catch(report);
  }

  function savePref() {
    try { localStorage.setItem("el_notify", notifyPref ? "1" : "0"); } catch (error) {}
  }

  function updateNotifyUI() {
    if (notifyPref && (typeof Notification === "undefined" || Notification.permission !== "granted")) {
      notifyPref = false;
    }
    notifyToggle.textContent = notifyPref ? "关闭提醒" : "开启提醒";
    notifyToggle.className = notifyPref ? "primary" : "";
    if (!secure) {
      notifyStateEl.textContent = "仅页面内提醒";
      notifyToggle.textContent = "系统通知不可用";
      notifyToggle.disabled = true;
      notifyHintEl.textContent = "当前是局域网 HTTP 连接，浏览器不允许系统通知。保持页面打开时仍会在顶部显示提醒；通过 HTTPS 打开后可开启系统通知。";
      return;
    }
    if (typeof Notification === "undefined" || typeof Notification.requestPermission !== "function") {
      notifyStateEl.textContent = "不支持系统通知";
      notifyHintEl.textContent = "这个浏览器不支持系统通知，但页面打开时仍会在顶部提醒你。";
      notifyToggle.disabled = true;
      return;
    }
    notifyStateEl.textContent = notifyPref ? "已开启" : Notification.permission === "denied" ? "已被浏览器阻止" : "未开启";
    notifyToggle.disabled = Notification.permission === "denied";
    notifyHintEl.textContent = "服务器崩溃、安装失败或意外停止时提醒你。提醒只在本机页面产生，不会经过第三方推送服务。";
  }

  function toggleNotify() {
    if (notifyPref) {
      notifyPref = false;
      savePref();
      updateNotifyUI();
      toast("已关闭提醒");
      return;
    }
    if (!secure || typeof Notification === "undefined" || typeof Notification.requestPermission !== "function") {
      toast("系统通知需要 HTTPS 连接；页面内的提醒仍会工作。", true);
      return;
    }
    if (Notification.permission === "denied") {
      toast("浏览器已阻止通知，请在网站设置中允许。", true);
      return;
    }
    Notification.requestPermission().then(function (permission) {
      notifyPref = permission === "granted";
      savePref();
      updateNotifyUI();
      toast(notifyPref ? "提醒已开启" : "未获得通知权限", !notifyPref);
    }).catch(function () {
      toast("无法请求通知权限。", true);
    });
  }

  function notify(title, body, tag) {
    if (!notifyPref || typeof Notification === "undefined" || Notification.permission !== "granted") {
      return;
    }
    var options = { body: body, tag: tag, icon: "/icon-192.png", badge: "/icon-192.png" };
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(function (registration) {
        return registration.showNotification(title, options);
      }).catch(function () {
        try { new Notification(title, options); } catch (error) {}
      });
    } else {
      try { new Notification(title, options); } catch (error) {}
    }
  }

  function alertEvent(text) {
    alertText.textContent = text;
    alertBar.classList.remove("hidden");
  }

  function track(next) {
    var states = {};
    next.forEach(function (server) { states[server.id] = server.status; });
    if (known === null) {
      known = states;
      return;
    }
    next.forEach(function (server) {
      var previous = known[server.id];
      if (!previous || previous === server.status) return;
      var detail = server.message ? "：" + server.message : "";
      if (server.status === "crashed") {
        alertEvent(server.name + " 已崩溃" + detail);
        notify(server.name, "服务器已崩溃" + detail, "crash-" + server.id);
      } else if (server.status === "installationFailed") {
        alertEvent(server.name + " 安装失败" + detail);
        notify(server.name, "安装失败" + detail, "install-" + server.id);
      } else if (previous === "running" && server.status === "stopped") {
        notify(server.name, "服务器已停止", "stop-" + server.id);
      } else if ((previous === "starting" || previous === "restarting") && server.status === "running") {
        notify(server.name, "服务器已启动", "start-" + server.id);
      }
    });
    known = states;
  }

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    installPrompt = event;
    installButton.classList.remove("hidden");
  });
  window.addEventListener("appinstalled", function () {
    installPrompt = null;
    installButton.classList.add("hidden");
    toast("已添加到主屏幕");
  });
  installButton.addEventListener("click", function () {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(function (choice) {
      if (choice && choice.outcome === "accepted") toast("已添加到主屏幕");
      installPrompt = null;
      installButton.classList.add("hidden");
    }).catch(function () {
      installPrompt = null;
      installButton.classList.add("hidden");
    });
  });
  notifyToggle.addEventListener("click", toggleNotify);
  document.getElementById("alertClose").addEventListener("click", function () {
    alertBar.classList.add("hidden");
  });
  if (secure && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }

  document.getElementById("commandForm").addEventListener("submit", function (event) {
    event.preventDefault();
    var input = document.getElementById("commandInput");
    var command = input.value.trim();
    if (!selected || !command) return;
    api("/api/command", { id: selected, command: command }).then(function () {
      input.value = "";
      setTimeout(loadConsole, 400);
    }).catch(report);
  });
  document.getElementById("closeConsole").onclick = function () {
    selected = null;
    panel.classList.add("hidden");
    render();
  };

  updateNotifyUI();
  boot();
})();
</script>
</body>
</html>
