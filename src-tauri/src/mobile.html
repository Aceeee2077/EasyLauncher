<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08120d">
<title>EasyLauncher 手机控制台</title>
<style>
:root {
  color-scheme: dark;
  --bg: #060f0a;
  --panel: rgba(22, 38, 29, 0.72);
  --line: rgba(158, 255, 195, 0.14);
  --text: #eaf6ee;
  --muted: #9db4a6;
  --green: #59e08d;
  --amber: #f0bf5f;
  --red: #ff7a7a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(44, 120, 78, 0.45), transparent 62%),
    radial-gradient(900px 600px at -10% 30%, rgba(20, 70, 48, 0.5), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  min-height: 100vh;
}
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: 0.2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
.conn { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.03); }
.conn.bad { color: var(--red); border-color: rgba(255,122,122,0.35); }
main { display: grid; gap: 14px; }
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.05);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 620; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; }
.badge { flex: none; font-size: 11px; padding: 5px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.badge.stopped, .badge.installationFailed { color: var(--muted); border-color: var(--line); }
.badge.installing, .badge.starting, .badge.stopping, .badge.restarting { color: var(--amber); background: rgba(240,191,95,0.1); border-color: rgba(240,191,95,0.3); }
.badge.running { color: var(--green); background: rgba(89,224,141,0.1); border-color: rgba(89,224,141,0.32); }
.badge.crashed { color: var(--red); background: rgba(255,122,122,0.1); border-color: rgba(255,122,122,0.32); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
button {
  font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
  border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06);
  padding: 9px 13px; min-height: 38px;
  transition: transform 0.12s ease, background 0.15s ease;
}
button:active { transform: scale(0.97); }
button.primary { background: rgba(89, 224, 141, 0.16); border-color: rgba(89,224,141,0.4); color: #c9ffdd; }
button.danger { background: rgba(255, 122, 122, 0.12); border-color: rgba(255,122,122,0.35); color: #ffd2d2; }
button:disabled { opacity: 0.4; cursor: default; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 620; }
pre {
  margin: 0 0 12px; padding: 12px; border-radius: 14px;
  background: rgba(0, 0, 0, 0.42); border: 1px solid rgba(255,255,255,0.05);
  font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  font-size: 11.5px; line-height: 1.55; color: #cfe6d8;
  height: 42vh; min-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
form { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text);
  background: rgba(0,0,0,0.34); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  outline: none;
}
input:focus { border-color: rgba(89,224,141,0.5); }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 8px; }
.hidden { display: none; }
footer { margin-top: 18px; text-align: center; color: rgba(157,180,166,0.7); font-size: 11px; line-height: 1.6; }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
  max-width: 86vw; padding: 10px 15px; border-radius: 999px;
  background: rgba(15, 28, 21, 0.94); border: 1px solid var(--line);
  color: #dff7e8; font-size: 12.5px; transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 20;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { border-color: rgba(255,122,122,0.4); color: #ffd7d7; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>EasyLauncher</div>
  <div class="conn" id="conn">连接中…</div>
</header>
<main>
  <section id="servers"></section>
  <section class="panel hidden" id="consolePanel">
    <div class="panel-head">
      <h2 id="consoleTitle">控制台</h2>
      <button type="button" id="closeConsole">收起</button>
    </div>
    <pre id="console"></pre>
    <form id="commandForm">
      <input id="commandInput" placeholder="输入命令，例如 say 大家好" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">发送</button>
    </form>
  </section>
</main>
<footer>
  仅在同一局域网内可用 · 关闭手机控制台或退出 EasyLauncher 后链接立即失效
</footer>
<div id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  var token = new URLSearchParams(location.search).get("token") || "";
  var selected = null;
  var servers = [];
  var busy = false;
  var toastTimer = null;
  var labels = {
    stopped: "已停止", installing: "安装中", installationFailed: "安装失败",
    starting: "启动中", running: "运行中", stopping: "停止中",
    restarting: "重启中", crashed: "已崩溃"
  };
  var activeStates = ["starting", "running", "stopping", "restarting"];
  var serversEl = document.getElementById("servers");
  var panel = document.getElementById("consolePanel");
  var consoleEl = document.getElementById("console");
  var titleEl = document.getElementById("consoleTitle");
  var connEl = document.getElementById("conn");
  var toastEl = document.getElementById("toast");

  if (!token) {
    serversEl.innerHTML = '<div class="card empty">链接缺少访问令牌，请在 EasyLauncher 中重新扫码。</div>';
    return;
  }

  function toast(text, bad) {
    toastEl.textContent = text;
    toastEl.className = "show" + (bad ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ""; }, 2600);
  }

  function api(path, body) {
    var url = path + (path.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(token);
    var options = body ? {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    } : {};
    return fetch(url, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) throw new Error(data.error || ("请求失败 " + response.status));
        return data;
      });
    });
  }

  function setConn(ok, text) {
    connEl.textContent = text;
    connEl.className = "conn" + (ok ? "" : " bad");
  }

  function action(id, name, kind) {
    if (busy) return;
    busy = true;
    render();
    api("/api/action", { id: id, action: kind }).then(function () {
      toast(name + " · " + (kind === "start" ? "启动请求已发送" : kind === "stop" ? "停止请求已发送" : "重启请求已发送"));
      setTimeout(refresh, 900);
    }).catch(function (error) {
      toast(error.message, true);
    }).finally(function () {
      busy = false;
      render();
    });
  }

  function openConsole(server) {
    selected = server.id;
    titleEl.textContent = server.name + " · 控制台";
    panel.classList.remove("hidden");
    consoleEl.textContent = "";
    loadConsole();
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    render();
  }

  function render() {
    serversEl.textContent = "";
    if (!servers.length) {
      var empty = document.createElement("div");
      empty.className = "card empty";
      empty.textContent = "还没有服务器。先在电脑上创建一个吧。";
      serversEl.appendChild(empty);
      return;
    }
    servers.forEach(function (server) {
      var card = document.createElement("article");
      card.className = "card";
      var head = document.createElement("div");
      head.className = "card-head";
      var info = document.createElement("div");
      var name = document.createElement("h3");
      name.textContent = server.name;
      var meta = document.createElement("div");
      meta.className = "meta";
      var players = server.players > 0 ? " · " + server.players + " 名玩家在线" : "";
      meta.textContent = "端口 " + server.port + players;
      info.appendChild(name);
      info.appendChild(meta);
      var badge = document.createElement("span");
      badge.className = "badge " + server.status;
      badge.textContent = labels[server.status] || server.status;
      head.appendChild(info);
      head.appendChild(badge);
      card.appendChild(head);

      if (server.message && activeStates.indexOf(server.status) >= 0) {
        var note = document.createElement("p");
        note.className = "meta";
        note.style.margin = "8px 0 0";
        note.textContent = server.message;
        card.appendChild(note);
      }

      var actions = document.createElement("div");
      actions.className = "actions";
      var active = activeStates.indexOf(server.status) >= 0;
      if (!active) {
        var start = document.createElement("button");
        start.className = "primary";
        start.textContent = server.status === "crashed" ? "重新启动" : "启动";
        start.disabled = busy || server.status === "installing";
        start.onclick = function () { action(server.id, server.name, "start"); };
        actions.appendChild(start);
      } else {
        var stop = document.createElement("button");
        stop.className = "danger";
        stop.textContent = "停止";
        stop.disabled = busy;
        stop.onclick = function () { action(server.id, server.name, "stop"); };
        actions.appendChild(stop);
      }
      if (server.status === "running") {
        var restart = document.createElement("button");
        restart.textContent = "重启";
        restart.disabled = busy;
        restart.onclick = function () { action(server.id, server.name, "restart"); };
        actions.appendChild(restart);
      }
      var consoleButton = document.createElement("button");
      consoleButton.textContent = selected === server.id ? "正在查看控制台" : "查看控制台";
      consoleButton.disabled = selected === server.id;
      consoleButton.onclick = function () { openConsole(server); };
      actions.appendChild(consoleButton);
      card.appendChild(actions);
      serversEl.appendChild(card);
    });
  }

  function refresh() {
    return api("/api/state").then(function (data) {
      servers = data.servers || [];
      setConn(true, "已连接");
      render();
      if (selected && !servers.some(function (server) { return server.id === selected; })) {
        selected = null;
        panel.classList.add("hidden");
      }
    }).catch(function (error) {
      setConn(false, "连接断开");
      toast(error.message, true);
    });
  }

  function loadConsole() {
    if (!selected) return;
    api("/api/console?id=" + encodeURIComponent(selected)).then(function (data) {
      var lines = data.lines || [];
      var atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 60;
      consoleEl.textContent = lines.map(function (line) { return line.text; }).join("\n");
      if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
    }).catch(function (error) {
      toast(error.message, true);
    });
  }

  document.getElementById("commandForm").addEventListener("submit", function (event) {
    event.preventDefault();
    var input = document.getElementById("commandInput");
    var command = input.value.trim();
    if (!selected || !command) return;
    api("/api/command", { id: selected, command: command }).then(function () {
      input.value = "";
      setTimeout(loadConsole, 400);
    }).catch(function (error) {
      toast(error.message, true);
    });
  });
  document.getElementById("closeConsole").onclick = function () {
    selected = null;
    panel.classList.add("hidden");
    render();
  };

  refresh();
  setInterval(refresh, 3000);
  setInterval(loadConsole, 2500);
})();
</script>
</body>
</html>
